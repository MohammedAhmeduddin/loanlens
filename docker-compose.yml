# PostgreSQL feature store (+ pgAdmin, local use only).
# MLflow runs are stored in ./mlflow/mlruns; browse them with:
#   mlflow ui --backend-store-uri ./mlflow/mlruns --port 5001

services:
  postgres:
    image: postgres:16
    container_name: loanlens_postgres
    environment:
      POSTGRES_DB: loanlens
      POSTGRES_USER: loanlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loanlens"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: loanlens_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@loanlens.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
