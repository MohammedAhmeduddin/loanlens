[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loanlens"
version = "0.1.0"
description = "RAG-powered credit risk explainer over CFPB regulations"
requires-python = ">=3.11"

dependencies = [
    # Core ML
    "xgboost>=2.0",
    "shap>=0.45",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",

    # RAG + LLM
    "langchain>=0.1",
    "langchain-community>=0.0.20",
    "langchain-openai>=0.0.5",
    "chromadb>=0.4.22",
    "openai>=1.12",
    "sentence-transformers>=2.6",
    "ragas>=0.1",

    # MLOps
    "mlflow>=2.10",

    # API
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",

    # Database
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",

    # dbt
    "dbt-core>=1.7",
    "dbt-postgres>=1.7",

    # Utilities
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "gradio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "httpx>=0.27",
    "ruff>=0.3",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/loanlens --cov-report=term-missing --cov-config=.coveragerc"

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

