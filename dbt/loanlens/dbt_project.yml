name: "loanlens"
version: "1.0.0"
config-version: 2

profile: "loanlens"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  loanlens:
    staging:
      +materialized: view
      +schema: staging
    features:
      +materialized: table
      +schema: features
