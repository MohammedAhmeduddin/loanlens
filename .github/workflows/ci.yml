name: LoanLens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      POSTGRES_PASSWORD: test_password
      OPENAI_API_KEY: sk-test-key-for-ci
      PYTHONDONTWRITEBYTECODE: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install langchain-text-splitters pypdf

      - name: Lint (ruff, version pinned in pyproject)
        run: ruff check src tests scripts

      - name: Run tests (coverage gate from .coveragerc)
        run: |
          python -m pytest tests/ \
            --no-header \
            -q
        env:
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "1"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: .coverage
          include-hidden-files: true   # .coverage starts with a dot; skipped by default
